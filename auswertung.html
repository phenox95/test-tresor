<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auswertung · Der Tresor der Zeit</title>
<style>
  body { font: 16px/1.5 "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; margin: 0; background: #F4EEDD; color: #2B2418; }
  header { background: #141D1F; color: #EDE7D9; padding: 18px 28px; border-bottom: 4px solid #C99A45; }
  header h1 { margin: 0; font: 700 1.6rem Georgia, serif; } header p { margin: 4px 0 0; color: #A9B3AC; }
  main { padding: 20px 28px 60px; max-width: 1200px; margin: 0 auto; }
  h2 { font: 700 1.3rem Georgia, serif; margin: 28px 0 8px; border-bottom: 2px solid #C99A45; padding-bottom: 4px; }
  h3 { font: 700 1.05rem Georgia, serif; margin: 18px 0 6px; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: .93rem; margin: 6px 0 14px; }
  th, td { border: 1px solid #C9BFA5; padding: 5px 9px; text-align: left; vertical-align: top; }
  th { background: #EAE0C8; } td.n, th.n { text-align: right; white-space: nowrap; }
  tr.warn td { background: #FBE7DF; } tr.ok td { background: #F4F8EC; }
  .drop { border: 3px dashed #C99A45; border-radius: 14px; padding: 26px; text-align: center; background: #fff; }
  button, input[type=file] { font: inherit; } button { padding: 8px 16px; border-radius: 8px; border: 2px solid #2B2418; background: #fff; cursor: pointer; }
  .muted { color: #5B665F; } .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #E6D7B3; font-size: .82rem; }
  .txt { white-space: pre-wrap; background: #fff; border: 1px solid #C9BFA5; padding: 8px 10px; margin: 4px 0; }
  @media print { .drop, button { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<header><h1>Auswertung · Der Tresor der Zeit</h1><p>Nur für die Lehrkraft. Die Dateien werden nur in diesem Browser gelesen und nirgendwohin gesendet.</p></header>
<main>
  <div class="drop">
    <p><strong>Spielstand-Dateien der Teams auswählen</strong> (mehrere gleichzeitig möglich, Endung .json)</p>
    <input id="files" type="file" accept=".json,application/json" multiple>
  </div>
  <div id="out"></div>
</main>
<script>
var CATALOG = [
  ['m1.1', 'Mission 1.1 · Die Behauptung', [['r1-1-typen', 'Rede markieren'], ['r1-1-these', 'These (Text)'], ['r1-1-fragetext', 'Untersuchungsfrage (Text)'], ['r1-1-frage', 'Fragen im Abgleich'], ['r1-1-quelle', 'Bonus: zwei Aussagen im Vergleich']]],
  ['m1.2', 'Mission 1.2 · Das Modell', [['r1-2-modell', 'Nachfragen: Annahmen'], ['r1-2-kette', 'Wirkungskette (Papier)'], ['r1-2-vorhersage', 'Vorhersagen ableiten'], ['r1-2-versuch', 'Bonus: Versuch planen']]],
  ['m1.3', 'Mission 1.3 · Die Prüfung', [['r1-3-zahl', 'Zahl ablesen (B2)'], ['r1-3-einspruch', 'Einspruch'], ['r1-3-kette', 'Darwin-Netz'], ['r1-3-belege', 'Belege zuordnen'], ['r1-3-schloss', 'Schloss (Dreierprüfung)'], ['r1-3-modellkritik', 'Bonus: Modellkritik'], ['r1-3-population', 'Bonus: Population']]]
];
var TEAMS = [];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function mins(ms) { return ms == null ? '–' : (ms / 60000).toFixed(1).replace('.', ','); }
function median(a) { if (!a.length) return null; a = a.slice().sort(function (x, y) { return x - y; }); var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }

function analyse(state, fname) {
  var log = (state.log || []).map(function (l) { return { t: new Date(l.t).getTime(), e: l.e }; });
  var res = { name: (state.team || []).join(', ') || fname, file: fname, puzzles: {}, missions: {}, audio: [], state: state };
  log.forEach(function (l) {
    var m;
    if ((m = /^audio (\S+)/.exec(l.e))) { if (res.audio.indexOf(m[1]) === -1) res.audio.push(m[1]); }
    else if ((m = /^öffnet (\S+)/.exec(l.e))) { var p = res.puzzles[m[1]] = res.puzzles[m[1]] || { fails: 0, hints: 0 }; if (p.open == null) p.open = l.t; }
    else if ((m = /^fehlversuch (\S+)/.exec(l.e))) { (res.puzzles[m[1]] = res.puzzles[m[1]] || { fails: 0, hints: 0 }).fails++; }
    else if ((m = /^gelöst (\S+)/.exec(l.e))) { var q = res.puzzles[m[1]] = res.puzzles[m[1]] || { fails: 0, hints: 0 }; if (q.done == null) q.done = l.t; }
    else if ((m = /^freigeschaltet (\S+)/.exec(l.e))) { res.missions[m[1]] = res.missions[m[1]] || {}; res.missions[m[1]].start = l.t; }
  });
  Object.keys(state.hints || {}).forEach(function (id) { (res.puzzles[id] = res.puzzles[id] || { fails: 0, hints: 0 }).hints = state.hints[id]; });
  Object.keys(state.solved || {}).forEach(function (id) {
    var p = res.puzzles[id] = res.puzzles[id] || { fails: 0, hints: 0 };
    p.solved = true; p.rescue = !!state.solved[id].rescue;
    if (p.done == null && state.solved[id].t && state.solved[id].t !== 'code') p.done = new Date(state.solved[id].t).getTime();
  });
  CATALOG.forEach(function (c) {
    var last = null; c[2].forEach(function (pp) { var p = res.puzzles[pp[0]]; if (p && p.done && (last == null || p.done > last)) last = p.done; });
    var m = res.missions[c[0]]; if (m && m.start && last && state.solved[c[0]]) m.ms = last - m.start;
  });
  res.total = log.length ? log[log.length - 1].t - log[0].t : null;
  return res;
}
function pTime(p) { return p && p.open != null && p.done != null ? p.done - p.open : null; }

function render() {
  var out = document.getElementById('out'), h = '';
  if (!TEAMS.length) { out.innerHTML = ''; return; }
  h += '<h2>Klassenübersicht (' + TEAMS.length + ' Team' + (TEAMS.length === 1 ? '' : 's') + ')</h2>';
  h += '<p class="muted">Zeit = vom ersten Öffnen des Rätsels bis zur Lösung (Minuten, Median). Rot markiert: mindestens ein Team mit Notfallöffnung oder im Schnitt mehr als drei Fehlversuche.</p>';
  h += '<table><tr><th>Rätsel</th><th class="n">gelöst</th><th class="n">Zeit (Median)</th><th class="n">Fehlversuche (Ø)</th><th class="n">mit Tipp 3</th><th class="n">Notfall</th></tr>';
  CATALOG.forEach(function (c) {
    var mt = TEAMS.map(function (t) { return t.missions[c[0]] && t.missions[c[0]].ms; }).filter(function (x) { return x != null; });
    h += '<tr><th colspan="6">' + esc(c[1]) + ' · Missionszeit (Median): ' + mins(median(mt)) + ' Min. (' + mt.length + ' Team' + (mt.length === 1 ? '' : 's') + ' fertig)</th></tr>';
    c[2].forEach(function (pp) {
      var ps = TEAMS.map(function (t) { return t.puzzles[pp[0]]; });
      var solved = ps.filter(function (p) { return p && p.solved; }).length;
      var times = ps.map(pTime).filter(function (x) { return x != null; });
      var fails = ps.filter(Boolean).map(function (p) { return p.fails; });
      var avgF = fails.length ? fails.reduce(function (a, b) { return a + b; }, 0) / fails.length : 0;
      var t3 = ps.filter(function (p) { return p && p.hints >= 3; }).length;
      var nf = ps.filter(function (p) { return p && p.rescue; }).length;
      h += '<tr class="' + ((nf || avgF > 3) ? 'warn' : (solved === TEAMS.length ? 'ok' : '')) + '"><td>' + esc(pp[1]) + ' <span class="muted">(' + pp[0] + ')</span></td><td class="n">' + solved + '/' + TEAMS.length + '</td><td class="n">' + mins(median(times)) + '</td><td class="n">' + avgF.toFixed(1).replace('.', ',') + '</td><td class="n">' + t3 + '</td><td class="n">' + nf + '</td></tr>';
    });
  });
  h += '</table>';
  TEAMS.forEach(function (t) {
    h += '<h2>Team ' + esc(t.name) + ' <span class="muted">(' + esc(t.file) + ')</span></h2><p class="muted">Gesamtdauer der protokollierten Zeit: ' + mins(t.total) + ' Min. · Aufnahmen angehört: ' + (t.audio.length ? esc(t.audio.join(', ')) : 'keine') + '</p>';
    h += '<table><tr><th>Rätsel</th><th>Status</th><th class="n">Zeit (Min.)</th><th class="n">Tipps</th><th class="n">Fehlversuche</th></tr>';
    CATALOG.forEach(function (c) {
      c[2].forEach(function (pp) {
        var p = t.puzzles[pp[0]] || { fails: 0, hints: 0 };
        var status = p.solved ? (p.rescue ? '<span class="tag">Notfallöffnung</span>' : 'gelöst') : (p.open != null ? 'begonnen' : '–');
        h += '<tr class="' + (p.rescue ? 'warn' : '') + '"><td>' + esc(pp[1]) + '</td><td>' + status + '</td><td class="n">' + mins(pTime(p)) + '</td><td class="n">' + (p.hints || 0) + '</td><td class="n">' + (p.fails || 0) + '</td></tr>';
      });
    });
    h += '</table>';
    var ein = (t.state.vars && t.state.vars.einsprueche) || [];
    if (ein.length) {
      h += '<h3>Einsprüche in Mission 1.3</h3><table><tr><th>#</th><th>Aussage</th><th>Belege</th><th>Was zeigen die Belege?</th><th>Warum reicht das?</th><th>Ergebnis</th></tr>';
      ein.forEach(function (e, i) { h += '<tr><td class="n">' + (i + 1) + '</td><td>' + esc(e.st) + '</td><td>' + esc((e.ev || []).join(' + ')) + '</td><td>' + esc(e.a) + '</td><td>' + esc(e.b) + '</td><td>' + (e.res === 'ok' ? 'Aussage gekippt' : esc(e.res)) + '</td></tr>'; });
      h += '</table>';
    }
    var ans = t.state.answers || {}, keys = Object.keys(ans);
    if (keys.length) {
      h += '<h3>Texte des Teams</h3>';
      keys.forEach(function (k) { h += '<div><strong>' + esc(ans[k].title) + '</strong><div class="txt">' + esc(ans[k].text) + '</div></div>'; });
    }
  });
  out.innerHTML = h;
}
document.getElementById('files').addEventListener('change', function (ev) {
  TEAMS = []; var files = [].slice.call(ev.target.files), left = files.length;
  if (!left) { render(); return; }
  files.forEach(function (f) {
    var r = new FileReader();
    r.onload = function () {
      try { var d = JSON.parse(r.result); if (d.format === 'tresor-spielstand' && d.state) TEAMS.push(analyse(d.state, f.name)); else alert(f.name + ' ist keine Spielstand-Datei.'); }
      catch (e) { alert(f.name + ' konnte nicht gelesen werden.'); }
      if (--left === 0) { TEAMS.sort(function (a, b) { return a.name < b.name ? -1 : 1; }); render(); }
    };
    r.readAsText(f);
  });
});
</script>
</body>
</html>
